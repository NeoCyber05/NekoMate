&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

   * @param {string} property

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );

    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);

    }
    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {

    connectorGlobals.visualization = {
      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {

        return () =&gt; {};
      },

  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

      return;
    }

        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  const defaults = combinations[0];
  const labels = [&#x27;Đế&#x27;, &#x27;Dải màu&#x27;, &#x27;Nắp&#x27;, &#x27;Tai&#x27;, &#x27;Lòng tai&#x27;, &#x27;Viền màn hình&#x27;, &#x27;Chân trước&#x27;, &#x27;Đuôi&#x27;];

  // Phép xoay (theo hàng) từ mô hình lắp ráp sang hướng in, đo khớp với 8 STL gốc ở thư mục cha.
  const printRotations = [
    [1, 0, 0, 0, 0, -1, 0, 1, 0], [1, 0, 0, 0, 0, -1, 0, 1, 0], [-1, 0, 0, 0, 0, -1, 0, -1, 0],

  const originalParts = [];

  function draw() {
    const angle = Number(rotation.value) * Math.PI / 180;
    const width = viewport.clientWidth;
    const height = viewport.clientHeight;
    if (!width || !height || !renderer) return;
    const vertical = Math.max(146, 142 * height / width);
    const horizontal = vertical * width / height;
    camera.left = -horizontal / 2;
    camera.right = horizontal / 2;
    camera.top = vertical / 2;
    camera.bottom = -vertical / 2;
    camera.updateProjectionMatrix();
    camera.position.set(210 * Math.sin(angle), 131, 210 * Math.cos(angle));
    camera.lookAt(0, 49, 0);
    renderer.setSize(width, height, false);
    renderer.render(scene, camera);
  }

  function selectedStyles() {
    return Object.fromEntries(styleSelects.map(select =&gt; [select.dataset.part, select.value]));
  }

  function updateSelection() {
    const activeTheme = themes.find(theme =&gt; theme.colors.every((color, part) =&gt; color === inputs[part].value));
    colorSelect.value = activeTheme?.id ?? &#x27;&#x27;;
    const styles = selectedStyles();
    buttons.forEach((button, index) =&gt; {
      const combination = combinations[index];
      const selected = combination.theme === activeTheme?.id &amp;&amp;
        Object.entries(combination.styles).every(([part, style]) =&gt; styles[part] === style);
      button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
    });
  }

  function saveState() {
    const colors = inputs.map(input =&gt; input.value);
    const styles = selectedStyles();
    window.openai?.setWidgetState?.({
      modelContent: { colors: Object.fromEntries(labels.map((name, index) =&gt; [name, colors[index]])), styles },
      privateContent: { colors, styles }
    })?.catch(() =&gt; {});
  }

  function applyPalette(colors) {
    inputs.forEach((input, index) =&gt; {
      const candidate = colors?.[index];
      input.value = /^#[0-9a-f]{6}$/i.test(candidate) ? candidate : themes[0].colors[index];
      materials[index].color.set(input.value);
    });
    updateSelection();
    draw();
  }

  // ease &gt; 1: đuôi giữ độ dày lâu hơn rồi mới thon về chóp, trông tự nhiên hơn.
  function makeTail(outline, tipRadius, ease = 1) {
    const material = materials[7];
    const points = [[26.74, 5.5, -49], [26.74, 16, -49], ...outline].map(point =&gt; new THREE.Vector3(...point));
    const path = new THREE.CatmullRomCurve3(points);
    const segments = 80;
    const sides = 32;
    const baseRadius = 4.6;
    const geometry = new THREE.TubeGeometry(path, segments, baseRadius, sides);
    const positions = geometry.attributes.position;
    const vertex = new THREE.Vector3();
    for (let ring = 0; ring &lt;= segments; ring++) {
      const t = ring / segments;
      const center = path.getPointAt(t);
      const scale = THREE.MathUtils.lerp(1, tipRadius / baseRadius, t ** ease);
      for (let side = 0; side &lt;= sides; side++) {
        const index = ring * (sides + 1) + side;
        vertex.fromBufferAttribute(positions, index).sub(center).multiplyScalar(scale).add(center);
        positions.setXYZ(index, vertex.x, vertex.y, vertex.z);
      }
    }
    geometry.computeVertexNormals();
    const tail = new THREE.Group();
    tail.add(new THREE.Mesh(geometry, material));
    for (const [point, radius] of [[points[0], baseRadius], [points.at(-1), tipRadius]]) {
      const cap = new THREE.Mesh(new THREE.SphereGeometry(radius, sides, 16), material);
      cap.position.copy(point);
      tail.add(cap);
    }
    return tail;
  }

  function extrude(contour, depth, bevel) {
    const outline = new THREE.Shape();
    outline.moveTo(...contour[0]);
    for (const segment of contour.slice(1)) {
      if (segment.length === 2) outline.lineTo(...segment);
      else outline.bezierCurveTo(...segment);
    }
    outline.closePath();
    return new THREE.ExtrudeGeometry(outline, {
      depth, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 16
    });
  }

  function makeEars(contour, tilt = 0) {
    const outers = extrude(contour, 6.6, 1.15);
    const inserts = extrude(contour, 0.7, 0.32);
    const ears = new THREE.Group();
    for (const side of [-1, 1]) {
      const ear = new THREE.Group();
      ear.position.set(24.5 * side, 85.3, 3.2);
      ear.scale.x = side;
      ear.rotation.x = tilt;
      const insert = new THREE.Mesh(inserts, materials[4]);
      insert.scale.set(0.66, 0.68, 1);
      insert.position.set(0, 3.0, 7.6);
      ear.add(new THREE.Mesh(outers, materials[3]), insert);
      ears.add(ear);
    }
    return ears;
  }

  function makePaws(geometry, y, z, scale = [1, 1, 1]) {
    const pair = new THREE.Group();
    for (const x of [-16, 16]) {
      const paw = new THREE.Mesh(geometry, materials[6]);
      paw.position.set(x, y, z);
      paw.scale.set(...scale);
      pair.add(paw);
    }
    return pair;
  }

  function showStyles() {
    const styles = selectedStyles();
    for (const [part, variants] of Object.entries(shapes)) {
      for (const [style, mesh] of Object.entries(variants)) mesh.visible = styles[part] === style;
    }
  }

  function applyStyles(styles) {
    styleSelects.forEach(select =&gt; {
      const part = select.dataset.part;
      const requested = styles?.[part];
      select.value = Object.hasOwn(shapes[part], requested) ? requested : defaults.styles[part];

  function applyState(state) {
    applyStyles(state?.styles);
    applyPalette(state?.styles ? state.colors : undefined);
  }

  function saveFile(blob, name) {
    const link = document.createElement(&#x27;a&#x27;);
    link.href = URL.createObjectURL(blob);
    link.download = name;
    // index.html bắt mọi click vào &lt;a&gt; để mở link ngoài; chặn lan lên để trình duyệt tải file.
    link.addEventListener(&#x27;click&#x27;, event =&gt; event.stopPropagation());
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() =&gt; URL.revokeObjectURL(link.href), 10000);
  }

  function exportConfig() {
    const config = {
      format: &#x27;vo-meo&#x27;, version: 1, styles: selectedStyles(),
      colors: Object.fromEntries(slugs.map((slug, index) =&gt; [slug, inputs[index].value]))
    };
    saveFile(new Blob([JSON.stringify(config, null, 2) + &#x27;\n&#x27;], { type: &#x27;application/json&#x27; }), &#x27;vo-meo.json&#x27;);
    fileStatus.textContent = &#x27;Đã xuất vo-meo.json.&#x27;;
  }

  function parseConfig(text) {
    const config = JSON.parse(text);
    if (config?.format !== &#x27;vo-meo&#x27; || typeof config.styles !== &#x27;object&#x27; || typeof config.colors !== &#x27;object&#x27;) {
      throw new Error(&#x27;File JSON không phải cấu hình vỏ mèo.&#x27;);
    }
    for (const part of Object.keys(shapes)) {
      if (!Object.hasOwn(shapes[part], config.styles[part])) throw new Error(`Kiểu &quot;${part}&quot; không hợp lệ.`);
    }
    const colors = slugs.map(slug =&gt; config.colors[slug]);
    if (!colors.every(color =&gt; /^#[0-9a-f]{6}$/i.test(color))) throw new Error(&#x27;Thiếu màu hoặc màu sai dạng #rrggbb.&#x27;);
    return { styles: config.styles, colors };
  }

  // Tam giác của một chi tiết đang hiển thị, đã xoay về hướng in, căn giữa và đặt sát mặt bàn (mm).
  function partTriangles(index) {
    scene.updateMatrixWorld(true);
    const toPrint = new THREE.Matrix4().setFromMatrix3(new THREE.Matrix3().set(...printRotations[index]));
    const points = [];
    scene.traverseVisible(object =&gt; {
      if (!object.isMesh || object.material !== materials[index]) return;
      const matrix = toPrint.clone().multiply(object.matrixWorld);
      const mirrored = matrix.determinant() &lt; 0;
      const position = object.geometry.attributes.position;
      const order = object.geometry.index?.array ?? Array.from({ length: position.count }, (_, i) =&gt; i);
      for (let i = 0; i &lt; order.length; i += 3) {
        const triangle = [0, 1, 2].map(k =&gt; new THREE.Vector3().fromBufferAttribute(position, order[i + k]).applyMatrix4(matrix));
        if (mirrored) triangle.reverse();
        points.push(...triangle);
      }
    });
    const box = new THREE.Box3().setFromPoints(points);
    const center = box.getCenter(new THREE.Vector3());
    const offset = new THREE.Vector3(-center.x, -center.y, -box.min.z);
    points.forEach(point =&gt; point.add(offset));
    return points;
  }

  function binaryStl(title, points) {
    const count = points.length / 3;
    const view = new DataView(new ArrayBuffer(84 + 50 * count));
    new TextEncoder().encodeInto(title.slice(0, 80), new Uint8Array(view.buffer, 0, 80));
    view.setUint32(80, count, true);
    const normal = new THREE.Vector3();
    const edge = new THREE.Vector3();
    for (let t = 0; t &lt; count; t++) {
      const [a, b, c] = points.slice(t * 3, t * 3 + 3);
      normal.subVectors(b, a).cross(edge.subVectors(c, a)).normalize();
      let offset = 84 + t * 50;
      for (const vector of [normal, a, b, c]) {
        for (const value of [vector.x, vector.y, vector.z]) {
          view.setFloat32(offset, value, true);
          offset += 4;
        }
      }
    }
    return new Uint8Array(view.buffer);
  }

  const crcTable = Array.from({ length: 256 }, (_, n) =&gt; {
    for (let k = 0; k &lt; 8; k++) n = n &amp; 1 ? 0xedb88320 ^ (n &gt;&gt;&gt; 1) : n &gt;&gt;&gt; 1;
    return n &gt;&gt;&gt; 0;
  });
  function crc32(bytes) {
    let crc = ~0;
    for (const byte of bytes) crc = crcTable[(crc ^ byte) &amp; 255] ^ (crc &gt;&gt;&gt; 8);
    return ~crc &gt;&gt;&gt; 0;
  }

  // ZIP không nén: giải nén ra được đúng một thư mục chứa các file.
  function makeZip(files) {
    const encoder = new TextEncoder();
    const chunks = [];
    const directory = [];
    let offset = 0;
    for (const { name, data } of files) {
      const nameBytes = encoder.encode(name);
      const crc = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [12, 33, 2], [14, crc, 4], [18, data.length, 4],
        [22, data.length, 4], [26, nameBytes.length, 2]]
        .forEach(([at, value, size]) =&gt; size === 4 ? local.setUint32(at, value, true) : local.setUint16(at, value, true));
      const entry = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [14, 33, 2], [16, crc, 4], [20, data.length, 4],
        [24, data.length, 4], [28, nameBytes.length, 2], [42, offset, 4]]
        .forEach(([at, value, size]) =&gt; size === 4 ? entry.setUint32(at, value, true) : entry.setUint16(at, value, true));
      chunks.push(local, nameBytes, data);
      directory.push(entry, nameBytes);
      offset += 30 + nameBytes.length + data.length;
    }
    const size = directory.reduce((sum, part) =&gt; sum + part.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, size, 4], [16, offset, 4]]
      .forEach(([at, value, bytes]) =&gt; bytes === 4 ? end.setUint32(at, value, true) : end.setUint16(at, value, true));
    return new Blob([...chunks, ...directory, end], { type: &#x27;application/zip&#x27; });
  }

  async function importConfig(file) {
    const { styles, colors } = parseConfig(await file.text());
    applyStyles(styles);
    applyPalette(colors);
    saveState();
    const folder = (file.name.replace(/\.json$/i, &#x27;&#x27;).replace(/[^\w.-]+/g, &#x27;_&#x27;) || &#x27;vo-meo&#x27;) + &#x27;_stl&#x27;;
    const notes = [&#x27;File in 3D vỏ mèo - mỗi file một màu nhựa (đơn vị mm).&#x27;, &#x27;&#x27;,
      `Kiểu: đuôi ${styles.tail}, tai ${styles.ears}, chân ${styles.paws}`, &#x27;&#x27;];
    const files = slugs.map((slug, index) =&gt; {
      const name = `${String(index + 1).padStart(2, &#x27;0&#x27;)}_${slug}_${colors[index].slice(1)}.stl`;
      notes.push(`${name}  ·  ${labels[index]}  ·  màu ${colors[index]}`);
      return { name: `${folder}/${name}`, data: binaryStl(`vo meo ${slug}`, partTriangles(index)) };
    });
    notes.push(&#x27;&#x27;, &#x27;Kiểu đuôi/tai/chân mới là mẫu xem thử: kiểm tra trong slicer và bật support khi cần.&#x27;);
    files.push({ name: `${folder}/mau_in.txt`, data: new TextEncoder().encode(notes.join(&#x27;\r\n&#x27;) + &#x27;\r\n&#x27;) });
    saveFile(makeZip(files), folder + &#x27;.zip&#x27;);
    fileStatus.textContent = `Đã tạo ${folder}.zip — giải nén ra thư mục ${folder} gồm 8 file STL.`;
  }

  try {
    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    viewport.append(renderer.domElement);
    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 550);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x666578, 1.9));
    const light = new THREE.DirectionalLight(0xffffff, 2.1);
    light.position.set(-85, 190, 130);
    scene.add(light);
    const fill = new THREE.DirectionalLight(0xffffff, 0.8);
    fill.position.set(110, 80, -150);
    scene.add(fill);
    const decode = value =&gt; Uint8Array.from(atob(value), char =&gt; char.charCodeAt(0)).buffer;

    meshes.forEach(([vertices, indices], index) =&gt; {
      const geometry = new THREE.BufferGeometry();
      const packed = new Int16Array(decode(vertices));
      geometry.setAttribute(&#x27;position&#x27;, new THREE.BufferAttribute(Float32Array.from(packed, v =&gt; v / 100), 3));
      geometry.setIndex(new THREE.BufferAttribute(new Uint16Array(decode(indices)), 1));
      geometry.computeVertexNormals();
      const material = new THREE.MeshStandardMaterial({ roughness: 0.82, flatShading: true });
      materials.push(material);
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
      originalParts.push(mesh);

      const label = document.createElement(&#x27;label&#x27;);
      label.className = &#x27;form-label&#x27;;
      label.append(labels[index] + &#x27; &#x27;);
      const input = document.createElement(&#x27;input&#x27;);
      input.type = &#x27;color&#x27;;
      input.className = &#x27;form-control form-control-color&#x27;;
      input.addEventListener(&#x27;input&#x27;, () =&gt; {
        material.color.set(input.value);
        updateSelection();
        draw();
      });
      input.addEventListener(&#x27;change&#x27;, saveState);
      label.append(input);
      palette.append(label);
      inputs.push(input);
    });

    const originalEars = new THREE.Group();
    originalEars.add(originalParts[3], originalParts[4]);
    shapes.tail = {
      // Dựng sau lưng rồi cong chóp như dấu hỏi.
      question: makeTail([
        [26.4, 28, -49.8], [25.6, 40, -50.6], [24.2, 51, -51.4],
        [21, 58.5, -52], [15.5, 61, -52.4], [11.5, 57.5, -52.6]
      ], 2.4, 1.8),
      // Nằm thấp, vòng qua góc đế rồi ôm dọc hông phải như mèo ngồi.
      wrap: makeTail([
        [34, 13, -51], [44, 10.5, -51.5], [51, 9.5, -46],
        [52, 9, -36], [51.5, 8.5, -25], [50.8, 8, -12], [50, 8, 0], [49.2, 8.5, 10]
      ], 2.6, 1.8),
      // Dựng lên, uốn mềm sang bên rồi hất chóp lên.
      relaxed: makeTail([
        [28, 26, -50], [32, 35, -51], [38.5, 40.5, -52],
        [45, 42, -52.5], [50, 45.5, -53], [52, 51.5, -53.3]
      ], 2.5, 1.6),
      curved: makeTail([
        [26, 26, -49.8], [22.3, 35.4, -51.8], [14.1, 42, -53],
        [5.3, 41, -53.5], [1.3, 34.7, -53.6], [5, 30.7, -53.6]
      ], 3.25),
      sweep: makeTail([
        [23.8, 25.5, -50], [15, 31, -51], [2, 32, -52], [-10, 35.8, -54],
        [-16, 43, -55.5], [-15.5, 50, -56.5]
      ], 2.8),
