services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"  # LAN-reachable so the ESP32 can connect; auth is enforced by passwd + acl
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto:/mosquitto/auth:ro
      - mosquitto_data:/mosquitto/data

volumes:
  mosquitto_data:
