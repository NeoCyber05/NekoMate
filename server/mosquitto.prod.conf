# Internal-only listeners: the server uses 1883 inside the Docker network,
# Caddy terminates TLS and forwards wss://DOMAIN/mqtt to 9001.
listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl
persistence true
persistence_location /mosquitto/data/
